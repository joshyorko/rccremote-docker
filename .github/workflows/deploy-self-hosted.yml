name: Deploy self-hosted RCC Remote

on:
  workflow_dispatch:
    inputs:
      target:
        description: Kamal target to deploy
        required: true
        default: admin
        type: choice
        options:
          - admin
          - rccremote
      action:
        description: Kamal action to run
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - setup
      version:
        description: Existing image tag to deploy; defaults to sha-<current commit>
        required: false
        type: string
  workflow_call:
    inputs:
      targets_json:
        description: JSON array of Kamal targets to deploy in order
        required: true
        type: string
      action:
        description: Kamal action to run
        required: false
        default: deploy
        type: string
      version:
        description: Existing image tag to deploy; defaults to sha-<current commit>
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-rcc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      targets_json: ${{ steps.vars.outputs.targets_json }}
      action: ${{ steps.vars.outputs.action }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Resolve deploy inputs
        id: vars
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TARGET: ${{ github.event.inputs.target || '' }}
          MANUAL_ACTION: ${{ github.event.inputs.action || '' }}
          MANUAL_VERSION: ${{ github.event.inputs.version || '' }}
          CALLED_TARGETS_JSON: ${{ inputs.targets_json || '' }}
          CALLED_ACTION: ${{ inputs.action || '' }}
          CALLED_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_call" ]; then
            targets_json="${CALLED_TARGETS_JSON}"
            action="${CALLED_ACTION:-deploy}"
            version="${CALLED_VERSION:-}"
          else
            target="${MANUAL_TARGET:-admin}"
            targets_json="[\"${target}\"]"
            action="${MANUAL_ACTION:-deploy}"
            version="${MANUAL_VERSION:-}"
          fi

          if [ -z "$version" ]; then
            version="sha-${GITHUB_SHA::7}"
          fi

          printf 'targets_json=%s\n' "$targets_json" >> "$GITHUB_OUTPUT"
          printf 'action=%s\n' "$action" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.target }}
    needs: prepare
    runs-on:
      - self-hosted
      - linux
      - arm64
      - pi5-01
      - kamal
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets_json) }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Ruby on runner
        shell: bash
        run: |
          set -euo pipefail
          runner_home="$(getent passwd "$(id -un)" | cut -d: -f6)"
          export RBENV_ROOT="${RBENV_ROOT:-$runner_home/.rbenv}"
          export PATH="$RBENV_ROOT/bin:$RBENV_ROOT/shims:$PATH"
          eval "$(rbenv init - bash)"
          ruby -v
          if ! bundle _2.6.9_ -v >/dev/null 2>&1; then
            gem install bundler -v 2.6.9 --no-document
          fi
          bundle -v

      - name: Configure persistent Bundler path
        shell: bash
        run: |
          set -euo pipefail
          runner_home="$(getent passwd "$(id -un)" | cut -d: -f6)"
          bundle_path="$runner_home/.local/share/bundle/rccremote-docker"
          bundle_app_config="$runner_home/.config/bundle/rccremote-docker"
          mkdir -p "$bundle_path" "$bundle_app_config"
          {
            printf 'BUNDLE_PATH=%s\n' "$bundle_path"
            printf 'BUNDLE_APP_CONFIG=%s\n' "$bundle_app_config"
          } >> "$GITHUB_ENV"

      - name: Install bundle
        shell: bash
        run: |
          set -euo pipefail
          runner_home="$(getent passwd "$(id -un)" | cut -d: -f6)"
          export RBENV_ROOT="${RBENV_ROOT:-$runner_home/.rbenv}"
          export PATH="$RBENV_ROOT/bin:$RBENV_ROOT/shims:$PATH"
          eval "$(rbenv init - bash)"
          bundle check || bundle install --jobs 4 --retry 3

      - name: Write deploy secrets to local files
        shell: bash
        env:
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          ADMIN_CLOUDFLARED_TOKEN: ${{ secrets.ADMIN_CLOUDFLARED_TOKEN }}
          RCCREMOTE_CLOUDFLARED_TOKEN: ${{ secrets.RCCREMOTE_CLOUDFLARED_TOKEN }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          set -euo pipefail

          mkdir -p config
          runner_home="$(getent passwd "$(id -un)" | cut -d: -f6)"
          fallback_file="$runner_home/.config/rccremote-docker/tunnels.env"
          if [ -f "$fallback_file" ]; then
            # shellcheck disable=SC1090
            . "$fallback_file"
          fi

          {
            printf 'SECRET_KEY_BASE=%s\n' "$SECRET_KEY_BASE"
            printf 'S3_ACCESS_KEY_ID=%s\n' "$S3_ACCESS_KEY_ID"
            printf 'S3_SECRET_ACCESS_KEY=%s\n' "$S3_SECRET_ACCESS_KEY"
            printf 'ADMIN_CLOUDFLARED_TOKEN=%s\n' "$ADMIN_CLOUDFLARED_TOKEN"
            printf 'RCCREMOTE_CLOUDFLARED_TOKEN=%s\n' "$RCCREMOTE_CLOUDFLARED_TOKEN"
          } > .env.kamal.local

          chmod 600 .env.kamal.local

          if [ -n "${RAILS_MASTER_KEY:-}" ]; then
            printf '%s' "$RAILS_MASTER_KEY" > config/master.key
            chmod 600 config/master.key
          else
            rm -f config/master.key
          fi

      - name: Verify runner can SSH to homelab-rcc
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes homelab-rcc "echo runner-ssh-ok >/dev/null"

      - name: Log in to GHCR
        shell: bash
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-ghcr"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$KAMAL_REGISTRY_PASSWORD" | docker login ghcr.io -u joshyorko --password-stdin

      - name: Wait for published image tag
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION_INPUT: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          version="${VERSION_INPUT}"
          case "$TARGET" in
            admin) image_ref="ghcr.io/joshyorko/rccremote-docker-admin:${version}" ;;
            rccremote) image_ref="ghcr.io/joshyorko/rccremote-docker-rccremote:${version}" ;;
            *)
              echo "Unsupported target: $TARGET" >&2
              exit 64
              ;;
          esac

          for attempt in $(seq 1 60); do
            if docker manifest inspect "$image_ref" >/dev/null 2>&1; then
              echo "Found $image_ref"
              exit 0
            fi

            echo "Waiting for $image_ref to appear in GHCR (attempt ${attempt}/60)"
            sleep 15
          done

          echo "Timed out waiting for $image_ref" >&2
          exit 1

      - name: Prepare runner SSH state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -R 10.10.10.106 -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1 || true
          ssh-keyscan 10.10.10.106 >> "$HOME/.ssh/known_hosts" 2>/dev/null
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Kamal on runner
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ACTION: ${{ needs.prepare.outputs.action }}
          VERSION_INPUT: ${{ needs.prepare.outputs.version }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          ADMIN_CLOUDFLARED_TOKEN: ${{ secrets.ADMIN_CLOUDFLARED_TOKEN }}
          RCCREMOTE_CLOUDFLARED_TOKEN: ${{ secrets.RCCREMOTE_CLOUDFLARED_TOKEN }}
        run: |
          set -euo pipefail
          runner_home="$(getent passwd "$(id -un)" | cut -d: -f6)"
          export RBENV_ROOT="${RBENV_ROOT:-$runner_home/.rbenv}"
          export PATH="$RBENV_ROOT/bin:$RBENV_ROOT/shims:$PATH"
          eval "$(rbenv init - bash)"
          fallback_file="$runner_home/.config/rccremote-docker/tunnels.env"
          if [ -f "$fallback_file" ]; then
            # shellcheck disable=SC1090
            . "$fallback_file"
          fi
          export ADMIN_CLOUDFLARED_TOKEN RCCREMOTE_CLOUDFLARED_TOKEN
          version="${VERSION_INPUT}"

          case "$TARGET" in
            admin) CONFIG_FILE="config/deploy.yml" ;;
            rccremote) CONFIG_FILE="config/deploy.rccremote.yml" ;;
            *)
              echo "Unsupported target: $TARGET" >&2
              exit 64
              ;;
          esac

          kamal_cmd() {
            bundle exec kamal "$@" -c "$CONFIG_FILE"
          }

          if [ "$ACTION" = "setup" ]; then
            kamal_cmd setup --skip-push --version "$version"
          else
            kamal_cmd deploy --skip-push --version "$version"
          fi

          # Setup skips accessories that already exist, so explicitly refresh the
          # target Cloudflare tunnel container from the current secrets/config.
          kamal_cmd accessory reboot cloudflared
