name: Deploy self-hosted RCC Remote

on:
  workflow_dispatch:
    inputs:
      target:
        description: Kamal target to deploy
        required: true
        default: admin
        type: choice
        options:
          - admin
          - rccremote
      action:
        description: Kamal action to run
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - setup

concurrency:
  group: deploy-rcc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - arm64
      - pi5-01
      - kamal
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      KAMAL_IMAGE: ghcr.io/basecamp/kamal:v2.10.1

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Write deploy secrets to local files
        shell: bash
        env:
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          ADMIN_CLOUDFLARED_TOKEN: ${{ secrets.ADMIN_CLOUDFLARED_TOKEN || secrets.CLOUDFLARED_TOKEN }}
          RCCREMOTE_CLOUDFLARED_TOKEN: ${{ secrets.RCCREMOTE_CLOUDFLARED_TOKEN || secrets.CLOUDFLARED_TOKEN }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          set -euo pipefail

          mkdir -p config

          {
            printf 'SECRET_KEY_BASE=%s\n' "$SECRET_KEY_BASE"
            printf 'S3_ACCESS_KEY_ID=%s\n' "$S3_ACCESS_KEY_ID"
            printf 'S3_SECRET_ACCESS_KEY=%s\n' "$S3_SECRET_ACCESS_KEY"
            printf 'ADMIN_CLOUDFLARED_TOKEN=%s\n' "$ADMIN_CLOUDFLARED_TOKEN"
            printf 'RCCREMOTE_CLOUDFLARED_TOKEN=%s\n' "$RCCREMOTE_CLOUDFLARED_TOKEN"
          } > .env.kamal.local

          chmod 600 .env.kamal.local

          if [ -n "${RAILS_MASTER_KEY:-}" ]; then
            printf '%s' "$RAILS_MASTER_KEY" > config/master.key
            chmod 600 config/master.key
          else
            rm -f config/master.key
          fi

      - name: Verify runner can SSH to homelab-rcc
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes homelab-rcc "echo runner-ssh-ok >/dev/null"

      - name: Log in to GHCR
        shell: bash
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-ghcr"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$KAMAL_REGISTRY_PASSWORD" | docker login ghcr.io -u joshyorko --password-stdin

      - name: Wait for published image tag
        shell: bash
        env:
          TARGET: ${{ github.event.inputs.target || 'admin' }}
        run: |
          set -euo pipefail

          version="sha-${GITHUB_SHA::7}"
          case "$TARGET" in
            admin) image_ref="ghcr.io/joshyorko/rccremote-docker-admin:${version}" ;;
            rccremote) image_ref="ghcr.io/joshyorko/rccremote-docker-rccremote:${version}" ;;
            *)
              echo "Unsupported target: $TARGET" >&2
              exit 64
              ;;
          esac

          for attempt in $(seq 1 60); do
            if docker manifest inspect "$image_ref" >/dev/null 2>&1; then
              echo "Found $image_ref"
              exit 0
            fi

            echo "Waiting for $image_ref to appear in GHCR (attempt ${attempt}/60)"
            sleep 15
          done

          echo "Timed out waiting for $image_ref" >&2
          exit 1

      - name: Pull official Kamal image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$KAMAL_IMAGE"

      - name: Run Kamal from official container
        shell: bash
        env:
          TARGET: ${{ github.event.inputs.target || 'admin' }}
          ACTION: ${{ github.event.inputs.action || 'deploy' }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          docker run --rm \
            --pull never \
            --entrypoint /bin/sh \
            -v "$PWD:/workspace" \
            -v "$HOME/.ssh:/mounted-ssh:ro" \
            -v "$RUNNER_TEMP/docker-ghcr:/mounted-docker:ro" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /workspace \
            -e TARGET \
            -e ACTION \
            -e VERSION="sha-${GITHUB_SHA::7}" \
            -e KAMAL_REGISTRY_PASSWORD \
            "$KAMAL_IMAGE" -lc '
              set -euo pipefail
              mkdir -p /root/.ssh /root/.docker
              cp -R /mounted-ssh/. /root/.ssh/
              cp -R /mounted-docker/. /root/.docker/ || true
              chmod 700 /root/.ssh
              find /root/.ssh -type f -exec chmod 600 {} \;
              ssh-keygen -R 10.10.10.106 -f /root/.ssh/known_hosts >/dev/null 2>&1 || true
              ssh-keyscan 10.10.10.106 >> /root/.ssh/known_hosts 2>/dev/null
              git config --global --add safe.directory /workspace

              case "$TARGET" in
                admin) CONFIG_FILE="config/deploy.yml" ;;
                rccremote) CONFIG_FILE="config/deploy.rccremote.yml" ;;
                *)
                  echo "Unsupported target: $TARGET" >&2
                  exit 64
                  ;;
              esac

              kamal_cmd() {
                /kamal/bin/kamal "$@" -c "$CONFIG_FILE"
              }

              if [ "$ACTION" = "setup" ]; then
                kamal_cmd setup --skip-push --version "$VERSION"
              else
                kamal_cmd deploy --skip-push --version "$VERSION"
              fi
            '
