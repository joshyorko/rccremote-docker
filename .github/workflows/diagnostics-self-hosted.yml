name: Diagnose self-hosted RCC Remote

on:
  workflow_dispatch:
    inputs:
      target:
        description: Kamal target to inspect
        required: true
        default: admin
        type: choice
        options:
          - admin
          - rccremote
      command:
        description: Kamal diagnostic command set to run
        required: true
        default: summary
        type: choice
        options:
          - summary
          - app_logs
          - proxy_logs
          - app_details
          - proxy_details
          - audit
      lines:
        description: Number of log lines for log commands
        required: true
        default: "200"
        type: string

concurrency:
  group: diagnostics-rcc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on:
      - self-hosted
      - linux
      - arm64
      - pi5-01
      - kamal
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      KAMAL_IMAGE: ghcr.io/basecamp/kamal:v2.10.1

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Write deploy secrets to local files
        shell: bash
        env:
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          ADMIN_CLOUDFLARED_TOKEN: ${{ secrets.ADMIN_CLOUDFLARED_TOKEN || secrets.CLOUDFLARED_TOKEN }}
          RCCREMOTE_CLOUDFLARED_TOKEN: ${{ secrets.RCCREMOTE_CLOUDFLARED_TOKEN || secrets.CLOUDFLARED_TOKEN }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          set -euo pipefail

          mkdir -p config

          {
            printf 'SECRET_KEY_BASE=%s\n' "$SECRET_KEY_BASE"
            printf 'S3_ACCESS_KEY_ID=%s\n' "$S3_ACCESS_KEY_ID"
            printf 'S3_SECRET_ACCESS_KEY=%s\n' "$S3_SECRET_ACCESS_KEY"
            printf 'ADMIN_CLOUDFLARED_TOKEN=%s\n' "$ADMIN_CLOUDFLARED_TOKEN"
            printf 'RCCREMOTE_CLOUDFLARED_TOKEN=%s\n' "$RCCREMOTE_CLOUDFLARED_TOKEN"
          } > .env.kamal.local

          chmod 600 .env.kamal.local

          if [ -n "${RAILS_MASTER_KEY:-}" ]; then
            printf '%s' "$RAILS_MASTER_KEY" > config/master.key
            chmod 600 config/master.key
          else
            rm -f config/master.key
          fi

      - name: Verify runner can SSH to homelab-rcc
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes homelab-rcc "echo runner-ssh-ok >/dev/null"

      - name: Pull official Kamal image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$KAMAL_IMAGE"

      - name: Run Kamal diagnostics
        shell: bash
        env:
          TARGET: ${{ github.event.inputs.target || 'admin' }}
          COMMAND: ${{ github.event.inputs.command || 'summary' }}
          LINES: ${{ github.event.inputs.lines || '200' }}
        run: |
          set -euo pipefail

          docker run --rm \
            --pull never \
            --entrypoint /bin/sh \
            -v "$PWD:/workspace" \
            -v "$HOME/.ssh:/mounted-ssh:ro" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /workspace \
            -e TARGET \
            -e COMMAND \
            -e LINES \
            "$KAMAL_IMAGE" -lc '
              set -euo pipefail
              export HOME=/tmp/kamal-home
              mkdir -p "$HOME/.ssh"
              cp -R /mounted-ssh/. "$HOME/.ssh/"
              chmod 700 "$HOME/.ssh"
              find "$HOME/.ssh" -type f -exec chmod 600 {} \;
              git config --global --add safe.directory /workspace

              case "$TARGET" in
                admin) CONFIG_FILE="config/deploy.yml" ;;
                rccremote) CONFIG_FILE="config/deploy.rccremote.yml" ;;
                *)
                  echo "Unsupported target: $TARGET" >&2
                  exit 64
                  ;;
              esac

              kamal_cmd() {
                /kamal/bin/kamal "$@" -c "$CONFIG_FILE"
              }

              fail=0
              run_check() {
                echo
                echo "==> $*"
                if ! "$@"; then
                  fail=1
                fi
              }

              case "$COMMAND" in
                summary)
                  run_check /kamal/bin/kamal version
                  run_check kamal_cmd details
                  run_check kamal_cmd app version
                  run_check kamal_cmd app containers
                  run_check kamal_cmd proxy details
                  ;;
                app_logs)
                  run_check kamal_cmd app logs --primary --lines "$LINES"
                  ;;
                proxy_logs)
                  run_check kamal_cmd proxy logs --primary --lines "$LINES"
                  ;;
                app_details)
                  run_check kamal_cmd app details
                  ;;
                proxy_details)
                  run_check kamal_cmd proxy details
                  ;;
                audit)
                  run_check kamal_cmd audit
                  ;;
                *)
                  echo "Unsupported diagnostics command: $COMMAND" >&2
                  exit 64
                  ;;
              esac

              exit "$fail"
            '
