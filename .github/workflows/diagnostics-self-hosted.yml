name: Diagnose self-hosted RCC Remote

on:
  workflow_dispatch:
    inputs:
      target:
        description: Kamal target to inspect
        required: true
        default: admin
        type: choice
        options:
          - admin
          - rccremote
      command:
        description: Kamal diagnostic command set to run
        required: true
        default: summary
        type: choice
        options:
          - summary
          - app_logs
          - proxy_logs
          - app_details
          - proxy_details
          - audit
      lines:
        description: Number of log lines for log commands
        required: true
        default: "200"
        type: string

concurrency:
  group: diagnostics-rcc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ${{ fromJSON(vars.SELF_HOSTED_RUNNER_LABELS_JSON) }}
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Ruby on runner
        shell: bash
        run: |
          set -euo pipefail
          runner_home="$(getent passwd "$(id -un)" | cut -d: -f6)"
          export RBENV_ROOT="${RBENV_ROOT:-$runner_home/.rbenv}"
          export PATH="$RBENV_ROOT/bin:$RBENV_ROOT/shims:$PATH"
          eval "$(rbenv init - bash)"
          ruby -v
          if ! bundle _2.6.9_ -v >/dev/null 2>&1; then
            gem install bundler -v 2.6.9 --no-document
          fi
          bundle -v

      - name: Configure persistent Bundler path
        shell: bash
        run: |
          set -euo pipefail
          runner_home="$(getent passwd "$(id -un)" | cut -d: -f6)"
          bundle_path="$runner_home/.local/share/bundle/rccremote-docker"
          bundle_app_config="$runner_home/.config/bundle/rccremote-docker"
          mkdir -p "$bundle_path" "$bundle_app_config"
          {
            printf 'BUNDLE_PATH=%s\n' "$bundle_path"
            printf 'BUNDLE_APP_CONFIG=%s\n' "$bundle_app_config"
          } >> "$GITHUB_ENV"

      - name: Install bundle
        shell: bash
        run: |
          set -euo pipefail
          runner_home="$(getent passwd "$(id -un)" | cut -d: -f6)"
          export RBENV_ROOT="${RBENV_ROOT:-$runner_home/.rbenv}"
          export PATH="$RBENV_ROOT/bin:$RBENV_ROOT/shims:$PATH"
          eval "$(rbenv init - bash)"
          bundle check || bundle install --jobs 4 --retry 3

      - name: Write deploy secrets to local files
        shell: bash
        env:
          KAMAL_SERVER_ALIAS: ${{ vars.KAMAL_SERVER_ALIAS }}
          KAMAL_KNOWN_HOST: ${{ vars.KAMAL_KNOWN_HOST }}
          KAMAL_SSH_USER: ${{ vars.KAMAL_SSH_USER }}
          KAMAL_ADMIN_HOST: ${{ vars.KAMAL_ADMIN_HOST }}
          KAMAL_RCCREMOTE_HOST: ${{ vars.KAMAL_RCCREMOTE_HOST }}
          RCCREMOTE_DATA_ROOT: ${{ vars.RCCREMOTE_DATA_ROOT }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          ADMIN_CLOUDFLARED_TOKEN: ${{ secrets.ADMIN_CLOUDFLARED_TOKEN }}
          RCCREMOTE_CLOUDFLARED_TOKEN: ${{ secrets.RCCREMOTE_CLOUDFLARED_TOKEN }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          set -euo pipefail

          mkdir -p config
          runner_home="$(getent passwd "$(id -un)" | cut -d: -f6)"
          fallback_file="$runner_home/.config/rccremote-docker/tunnels.env"
          if [ -f "$fallback_file" ]; then
            # shellcheck disable=SC1090
            . "$fallback_file"
          fi

          {
            printf 'KAMAL_SERVER_ALIAS=%s\n' "$KAMAL_SERVER_ALIAS"
            printf 'KAMAL_KNOWN_HOST=%s\n' "$KAMAL_KNOWN_HOST"
            printf 'KAMAL_SSH_USER=%s\n' "$KAMAL_SSH_USER"
            printf 'KAMAL_ADMIN_HOST=%s\n' "$KAMAL_ADMIN_HOST"
            printf 'KAMAL_RCCREMOTE_HOST=%s\n' "$KAMAL_RCCREMOTE_HOST"
            printf 'RCCREMOTE_DATA_ROOT=%s\n' "$RCCREMOTE_DATA_ROOT"
            printf 'S3_ENDPOINT=%s\n' "$S3_ENDPOINT"
            printf 'S3_BUCKET=%s\n' "$S3_BUCKET"
            printf 'SECRET_KEY_BASE=%s\n' "$SECRET_KEY_BASE"
            printf 'S3_ACCESS_KEY_ID=%s\n' "$S3_ACCESS_KEY_ID"
            printf 'S3_SECRET_ACCESS_KEY=%s\n' "$S3_SECRET_ACCESS_KEY"
            printf 'ADMIN_CLOUDFLARED_TOKEN=%s\n' "$ADMIN_CLOUDFLARED_TOKEN"
            printf 'RCCREMOTE_CLOUDFLARED_TOKEN=%s\n' "$RCCREMOTE_CLOUDFLARED_TOKEN"
          } > .env.kamal.local

          chmod 600 .env.kamal.local

          if [ -n "${RAILS_MASTER_KEY:-}" ]; then
            printf '%s' "$RAILS_MASTER_KEY" > config/master.key
            chmod 600 config/master.key
          else
            rm -f config/master.key
          fi

      - name: Verify runner can SSH to homelab-rcc
        shell: bash
        env:
          KAMAL_SERVER_ALIAS: ${{ vars.KAMAL_SERVER_ALIAS }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$KAMAL_SERVER_ALIAS" "echo runner-ssh-ok >/dev/null"

      - name: Prepare runner SSH state
        shell: bash
        env:
          KAMAL_KNOWN_HOST: ${{ vars.KAMAL_KNOWN_HOST }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -R "$KAMAL_KNOWN_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1 || true
          ssh-keyscan "$KAMAL_KNOWN_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Kamal diagnostics on runner
        shell: bash
        env:
          TARGET: ${{ github.event.inputs.target || 'admin' }}
          COMMAND: ${{ github.event.inputs.command || 'summary' }}
          LINES: ${{ github.event.inputs.lines || '200' }}
          ADMIN_CLOUDFLARED_TOKEN: ${{ secrets.ADMIN_CLOUDFLARED_TOKEN }}
          RCCREMOTE_CLOUDFLARED_TOKEN: ${{ secrets.RCCREMOTE_CLOUDFLARED_TOKEN }}
        run: |
          set -euo pipefail
          runner_home="$(getent passwd "$(id -un)" | cut -d: -f6)"
          export RBENV_ROOT="${RBENV_ROOT:-$runner_home/.rbenv}"
          export PATH="$RBENV_ROOT/bin:$RBENV_ROOT/shims:$PATH"
          eval "$(rbenv init - bash)"
          fallback_file="$runner_home/.config/rccremote-docker/tunnels.env"
          if [ -f "$fallback_file" ]; then
            # shellcheck disable=SC1090
            . "$fallback_file"
          fi
          export ADMIN_CLOUDFLARED_TOKEN RCCREMOTE_CLOUDFLARED_TOKEN

          case "$TARGET" in
            admin) CONFIG_FILE="config/deploy.yml" ;;
            rccremote) CONFIG_FILE="config/deploy.rccremote.yml" ;;
            *)
              echo "Unsupported target: $TARGET" >&2
              exit 64
              ;;
          esac

          kamal_cmd() {
            bundle exec kamal "$@" -c "$CONFIG_FILE"
          }

          fail=0
          run_check() {
            echo
            echo "==> $*"
            if ! "$@"; then
              fail=1
            fi
          }

          case "$COMMAND" in
            summary)
              run_check bundle exec kamal version
              run_check kamal_cmd details
              run_check kamal_cmd app version
              run_check kamal_cmd app containers
              run_check kamal_cmd proxy details
              ;;
            app_logs)
              run_check kamal_cmd app logs --primary --lines "$LINES"
              ;;
            proxy_logs)
              run_check kamal_cmd proxy logs --primary --lines "$LINES"
              ;;
            app_details)
              run_check kamal_cmd app details
              ;;
            proxy_details)
              run_check kamal_cmd proxy details
              ;;
            audit)
              run_check kamal_cmd audit
              ;;
            *)
              echo "Unsupported diagnostics command: $COMMAND" >&2
              exit 64
              ;;
          esac

          exit "$fail"
