<%
require "dotenv"

Dotenv.load(".env.kamal.local") if File.exist?(".env.kamal.local")

kamal_server_alias = ENV.fetch("KAMAL_SERVER_ALIAS")
kamal_admin_host = ENV.fetch("KAMAL_ADMIN_HOST")
kamal_rccremote_host = ENV.fetch("KAMAL_RCCREMOTE_HOST")
kamal_ssh_user = ENV.fetch("KAMAL_SSH_USER")
rccremote_data_root = ENV.fetch("RCCREMOTE_DATA_ROOT")
s3_endpoint = ENV.fetch("S3_ENDPOINT")
s3_bucket = ENV.fetch("S3_BUCKET")
%>
# Name of your application. Used to uniquely configure containers.
service: rccremote_docker

# Name of the container image (use your-user/app-name on external registries).
image: joshyorko/rccremote-docker-admin

# Deploy to these servers.
servers:
  web:
    - <%= kamal_server_alias %>
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

proxy:
  host: <%= kamal_admin_host %>
  app_port: 80
  ssl_redirect: true
  forward_headers: true
  ssl: false
  run:
    bind_ips:
      - 127.0.0.1

# Where you keep your container images.
registry:
  server: ghcr.io
  username: joshyorko
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - SECRET_KEY_BASE
    - RAILS_MASTER_KEY
    - S3_ACCESS_KEY_ID
    - S3_SECRET_ACCESS_KEY
    - AWS_ACCESS_KEY_ID:S3_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY:S3_SECRET_ACCESS_KEY
  clear:
    ACTIVE_STORAGE_SERVICE: s3
    # RCC management runtime inside the Rails container.
    # The RCC daemon itself runs as a separate Kamal deployment on rccremote.joshyorko.com.
    RCC_EXECUTION_MODE: local
    RCC_BINARY: /usr/local/bin/rcc
    ROBOCORP_HOME: /opt/robocorp
    ROBOTS_PATH: /robots
    HOLOLIB_ZIP_PATH: /hololib_zip
    RCC_REMOTE_ORIGIN: https://<%= kamal_rccremote_host %>
    RAILS_FORCE_SSL: true
    S3_ENDPOINT: <%= s3_endpoint %>
    S3_REGION: us-east-1
    S3_FORCE_PATH_STYLE: true
    S3_BUCKET: <%= s3_bucket %>
    AWS_REGION: us-east-1

    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Match this to any external database server to configure Active Record correctly
    # Use rccremote_docker-db for a db accessory server on same machine via local kamal docker network.
    # DB_HOST: 192.168.0.2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "<%= rccremote_data_root %>/robots:/robots"
  - "<%= rccremote_data_root %>/hololib_zip:/hololib_zip"
  - "<%= rccremote_data_root %>/robocorp:/opt/robocorp"
  - "<%= rccremote_data_root %>/storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-3.4.8
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
ssh:
  user: <%= kamal_ssh_user %>

accessories:
  cloudflared:
    image: cloudflare/cloudflared:latest
    host: <%= kamal_server_alias %>
    cmd: tunnel --no-autoupdate run
    env:
      secret:
        - TUNNEL_TOKEN:ADMIN_CLOUDFLARED_TOKEN
