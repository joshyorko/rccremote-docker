<%
require "dotenv"

Dotenv.load(".env.kamal.local") if File.exist?(".env.kamal.local")

kamal_server_alias = ENV.fetch("KAMAL_SERVER_ALIAS")
kamal_rccremote_host = ENV.fetch("KAMAL_RCCREMOTE_HOST")
kamal_ssh_user = ENV.fetch("KAMAL_SSH_USER")
rccremote_data_root = ENV.fetch("RCCREMOTE_DATA_ROOT")
%>
# Dedicated Kamal deployment for the RCC Remote daemon service.
#
# Deploy with:
#   bin/kamal setup -c config/deploy.rccremote.yml
#   bin/kamal deploy -c config/deploy.rccremote.yml
service: rccremote_service
image: joshyorko/rccremote-docker-rccremote

servers:
  web:
    hosts:
      - <%= kamal_server_alias %>

proxy:
  host: <%= kamal_rccremote_host %>
  app_port: 4653
  ssl_redirect: true
  forward_headers: true
  ssl: false
  healthcheck:
    # rccremote has no native /health endpoint; /force/* returns 200.
    path: /force/_kamal_health
    interval: 2
    timeout: 5
  run:
    bind_ips:
      - 127.0.0.1

registry:
  server: ghcr.io
  username: joshyorko
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    SERVER_NAME: <%= kamal_rccremote_host %>
    ROBOCORP_HOME: /opt/robocorp
    ROBOTS_PATH: /robots
    HOLOLIB_ZIP_PATH: /hololib_zip
    HOLOLIB_ZIP_PATH_INT: /hololib_zip_internal
    RCCREMOTE_PORT: "4653"

deploy_timeout: 900
readiness_delay: 5

volumes:
  - "<%= rccremote_data_root %>/robots:/robots"
  - "<%= rccremote_data_root %>/hololib_zip:/hololib_zip"
  - "<%= rccremote_data_root %>/hololib_internal:/hololib_zip_internal"
  - "<%= rccremote_data_root %>/robocorp:/opt/robocorp"

builder:
  arch: amd64
  dockerfile: Dockerfile.rccremote
  context: .

ssh:
  user: <%= kamal_ssh_user %>

aliases:
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f

accessories:
  cloudflared:
    image: cloudflare/cloudflared:latest
    host: <%= kamal_server_alias %>
    cmd: tunnel --no-autoupdate run
    env:
      secret:
        - TUNNEL_TOKEN:RCCREMOTE_CLOUDFLARED_TOKEN
